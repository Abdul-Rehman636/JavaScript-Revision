<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Revision</title>
  </head>
  <style>
    button {
      cursor: pointer;
    }
  </style>
  <body>
    <h3>Variables in JavaScript</h3>
    <button onclick="varvariable()">Check Var Result</button>
    <button onclick="letvariable()">Check Let Result</button>
    <button onclick="constvariable()">Check Const Result</button>

    <button onclick="primitive()">Show Primitive Data Types</button>
    <button onclick="nonprimitive()">Show Non-Primitive Data Types</button>
    <h3>Operators in JavaScript</h3>
    <ul>
      <li>

        <button onclick="logicalOperator()">Logical Operator</button>

        <button onclick="gradesChecker()">Check your grades</button>
      </li>

        <button onclick="forLoop()">For Loop</button>
        <button onclick="whileLoop()">While Loop</button>
        <button onclick="doWhileLoop()">Do-While Loop</button>
      </li>
    </ul>

      <p>Special Loops</p>
      <li>
        <button onclick="forOfLoop()">For-Of Loops</button>
        <button onclick="forInLoop()">For-In Loops</button>
      </li>
    </ul>
    <ul>
      <h3>Loops Practices</h3>
      <li>
        <p>Show all even numbers.</p>
        <button onclick="evenNumbers()">Check Practice</button>
      </li>
      <li>
        <p>Show all odd numbers.</p>
        <button onclick="oddNumbers()">Check Practice</button>
      </li>
    </ul>
    <ul>
      <h3>Functions</h3>
      <li>
        <p>Check Function Example :-</p>
        <button onclick="checkFunction()">Check Practice</button>
      </li>
    </ul>
    <script src="script.js"></script>
